name: Build APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EURUSD-Line-Alarm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EURUSD-Line-Alarm-apk
          path: EURUSD-Line-Alarm.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" EURUSD-Line-Alarm.apk \
            --title "Build ${{ github.run_number }}" --notes "EURUSD Line Alarm APK"
